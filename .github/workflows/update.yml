name: 시세 갱신 및 배포

on:
  # 평일 UTC 22:30 = 한국 시간 화~토 07:30
  # 미국 정규장은 UTC 20:00(서머타임) 또는 21:00(겨울)에 끝나므로 두 경우 모두 마감 후입니다.
  schedule:
    - cron: "30 22 * * 1-5"
  # Actions 탭에서 수동으로 실행할 수 있습니다.
  workflow_dispatch:
  # site 폴더의 파일을 직접 고치면 새로 배포합니다(시세 호출은 하지 않습니다).
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 시세 갱신
        if: github.event_name != 'push'
        env:
          AV_API_KEY: ${{ secrets.AV_API_KEY }}
        run: python3 scripts/update.py

      - name: 변경된 data.json 저장
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "시세 갱신"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
